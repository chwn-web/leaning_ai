# dsh-session-anywhere bundle patch.
#
# A profile bundle's substance is this file: the host boot applies it over the
# empty root, so one `insert` row mounts the plugin with its own config.
# `name` is what the client bundle loader uses as the graph row id — it must
# stay equal to the package name (and to the id in lib/client.js).
- insert:
    - id: session-cloud
      name: 'dsh-session-anywhere'
